<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تست موتور ادابازی — نمایش و ویرایش</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #0B0B12; color: #E9E9F5;
    font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
  }
  header {
    position: sticky; top: 0; z-index: 2;
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 12px 16px; background: rgba(11,11,18,.92);
    backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,.1);
  }
  h1 { font-size: 15px; margin: 0; font-weight: 700; }
  .hint { font-size: 12px; color: #8E89A6; }
  .hint b { color: #E9C46A; }
  a { color: #22D3EE; font-size: 12px; }
  pre { margin: 0; padding: 16px; font-size: 13px; line-height: 1.75; tab-size: 2; }
  .ln { display: inline-block; width: 46px; text-align: left; color: #4A4763; user-select: none; }
  #src { white-space: pre; overflow-x: auto; }
</style>
</head>
<body>
<header>
  <h1>tests/engine.test.js</h1>
  <span class="hint">خطوط موردنظر را انتخاب کنید و برای من بفرستید — یا بگویید «خط ۳۵۰ تا ۳۹۰ را تغییر بده»</span>
  <a href="engine.test.js" download>دانلود فایل</a>
  <a href="https://github.com/SirMahdiW/adabazi/blob/main/tests/engine.test.js">ویرایش در گیت‌هاب</a>
</header>
<pre id="src">در حال بارگذاری…</pre>
<script>
fetch('engine.test.js')
  .then(r => r.text())
  .then(t => {
    const lines = t.split('\n');
    document.getElementById('src').innerHTML = lines.map((l, i) =>
      '<span class="ln">' + (i + 1) + '</span>' + (l || ' ')).join('\n');
  })
  .catch(e => { document.getElementById('src').textContent = 'خطا: ' + e.message; });
</script>
</body>
</html>
